<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="70%">
      <stop offset="0" stop-color="#3f6b2a"/>
      <stop offset="1" stop-color="#14240e"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6d77a"/>
      <stop offset="0.5" stop-color="#c8962e"/>
      <stop offset="1" stop-color="#7a5414"/>
    </linearGradient>
    <radialGradient id="meat" cx="40%" cy="35%" r="70%">
      <stop offset="0" stop-color="#d9773f"/>
      <stop offset="0.6" stop-color="#9c4520"/>
      <stop offset="1" stop-color="#5e2510"/>
    </radialGradient>
    <linearGradient id="bone" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fffaf0"/>
      <stop offset="1" stop-color="#d8ccb4"/>
    </linearGradient>
  </defs>

  <!-- frame -->
  <rect x="8" y="8" width="384" height="384" rx="48" fill="url(#gold)"/>
  <rect x="22" y="22" width="356" height="356" rx="38" fill="url(#bg)"/>

  <!-- paw prints -->
  <g fill="#ffffff" opacity="0.10">
    <g transform="translate(90 90) rotate(-20)">
      <ellipse cx="0" cy="0" rx="22" ry="18"/>
      <circle cx="-22" cy="-24" r="8"/><circle cx="-7" cy="-33" r="8"/>
      <circle cx="9" cy="-33" r="8"/><circle cx="24" cy="-24" r="8"/>
    </g>
    <g transform="translate(320 320) rotate(15)">
      <ellipse cx="0" cy="0" rx="16" ry="13"/>
      <circle cx="-16" cy="-17" r="6"/><circle cx="-5" cy="-24" r="6"/>
      <circle cx="6" cy="-24" r="6"/><circle cx="17" cy="-17" r="6"/>
    </g>
  </g>

  <!-- drumstick -->
  <mask id="bite">
    <rect x="-200" y="-200" width="400" height="400" fill="#fff"/>
    <circle cx="-14" cy="-66" r="26" fill="#000"/>
    <circle cx="24" cy="-52" r="20" fill="#000"/>
  </mask>
  <clipPath id="meatShape">
    <path d="M -95 0 C -95 -70 -10 -82 40 -38 C 62 -20 78 -14 78 0 C 78 14 62 20 40 38 C -10 82 -95 70 -95 0 Z"/>
  </clipPath>
  <g transform="translate(155 215) rotate(35)">
    <rect x="62" y="-13" width="78" height="26" rx="10" fill="url(#bone)" stroke="#3a2a14" stroke-width="5"/>
    <circle cx="146" cy="-15" r="17" fill="url(#bone)" stroke="#3a2a14" stroke-width="5"/>
    <circle cx="146" cy="15" r="17" fill="url(#bone)" stroke="#3a2a14" stroke-width="5"/>
    <rect x="120" y="-9" width="26" height="18" fill="#f3ead8"/>
    <g mask="url(#bite)">
      <path d="M -95 0 C -95 -70 -10 -82 40 -38 C 62 -20 78 -14 78 0 C 78 14 62 20 40 38 C -10 82 -95 70 -95 0 Z"
            fill="url(#meat)" stroke="#3a1a0a" stroke-width="6"/>
      <path d="M -66 24 C -40 44 0 44 22 32" fill="none" stroke="#f0a070" stroke-width="9" stroke-linecap="round" opacity="0.6"/>
    </g>
    <!-- bite rim -->
    <g clip-path="url(#meatShape)" fill="none" stroke-width="6">
      <circle cx="-14" cy="-66" r="29" stroke="#f3c9a0"/>
      <circle cx="24" cy="-52" r="23" stroke="#f3c9a0"/>
      <circle cx="-14" cy="-66" r="26" stroke="#3a1a0a"/>
      <circle cx="24" cy="-52" r="20" stroke="#3a1a0a"/>
    </g>
  </g>

  <!-- speech bubble -->
  <g>
    <path d="M 222 52 H 352 Q 366 52 366 66 V 136 Q 366 150 352 150 H 290 L 258 182 L 266 150 H 222 Q 208 150 208 136 V 66 Q 208 52 222 52 Z"
          fill="#ffffff" stroke="#3a2a14" stroke-width="6" stroke-linejoin="round"/>
    <text x="287" y="122" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif"
          font-size="64" font-weight="bold" font-style="italic" fill="#e08a1e" stroke="#3a2a14" stroke-width="2">/e</text>
  </g>
</svg>
